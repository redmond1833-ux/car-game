<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Гараж — Игра</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }
        #gameContainer {
            text-align: center;
        }
        .carOption:hover {
            border-color: #FF6B00 !important;
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(255, 107, 0, 0.4);
        }
        
        .carOption.selected {
            border-color: #FF6B00 !important;
            background: #3a2a1a !important;
        }
        canvas {
            background: #87CEEB;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.5);
            display: block;
            max-width: 100%;
        }
        #score {
            font-size: 24px;
            margin-top: 15px;
            color: #FF6B00;
            font-weight: bold;
        }
        #hint {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <!-- Экран выбора машины -->
        <div id="carSelect" style="
            background: #1a1a1a;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.5);
            display: block;
        ">
            <h1 style="color: #FF6B00; margin: 0 0 10px; font-size: 32px;">🚗 Выбери машину</h1>
            <p style="color: #888; margin: 0 0 25px;">На чём будешь покорять город?</p>
            
            <div style="display: flex; gap: 20px; justify-content: center;">
                <div class="carOption" data-car="mazda" style="
                    background: #2a2a2a;
                    border: 3px solid #444;
                    border-radius: 10px;
                    padding: 15px;
                    cursor: pointer;
                    transition: all 0.2s;
                    width: 150px;
                ">
                    <img src="assets/car_mazda.png" style="width: 100%; height: 80px; object-fit: contain;">
                    <div style="color: white; margin-top: 10px; font-weight: bold;">Mazda CX-5</div>
                </div>
                
                <div class="carOption" data-car="toyota" style="
                    background: #2a2a2a;
                    border: 3px solid #444;
                    border-radius: 10px;
                    padding: 15px;
                    cursor: pointer;
                    transition: all 0.2s;
                    width: 150px;
                ">
                    <img src="assets/car_toyota.png" style="width: 100%; height: 80px; object-fit: contain;">
                    <div style="color: white; margin-top: 10px; font-weight: bold;">Land Cruiser 250</div>
                </div>
                
                <div class="carOption" data-car="honda" style="
                    background: #2a2a2a;
                    border: 3px solid #444;
                    border-radius: 10px;
                    padding: 15px;
                    cursor: pointer;
                    transition: all 0.2s;
                    width: 150px;
                ">
                    <img src="assets/car_honda.png" style="width: 100%; height: 80px; object-fit: contain;">
                    <div style="color: white; margin-top: 10px; font-weight: bold;">Honda Fit</div>
                </div>
            </div>
        </div>

        <!-- Сама игра -->
        <div id="gameArea" style="display: none;">
            <canvas id="game" width="800" height="400"></canvas>
            <div id="score">Счёт: 0</div>
            <div id="hint">Пробел или тап — прыжок</div>
            <button id="changeCarBtn" style="
                margin-top: 15px;
                padding: 10px 20px;
                background: #2a2a2a;
                color: white;
                border: 2px solid #FF6B00;
                border-radius: 8px;
                cursor: pointer;
                font-size: 14px;
                font-weight: bold;
            ">🚗 Сменить машину</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        const W = canvas.width;
        const H = canvas.height;
        const GROUND_Y = H - 80;

        // ============ МАШИНА ============
        const car = {
            x: 100,
            y: GROUND_Y - 50,
            width: 100,
            height: 50,
            vy: 0,
            jumping: false,
            hangFrames: 0,
            rotation: 0,
            wheelRotation: 0,
            image: new Image()
        };

        // ============ НАСТРОЙКИ КОЛЁС ДЛЯ КАЖДОЙ МАШИНЫ ============
        // x — смещение от левого края машины (в % от ширины)
        // y — смещение от нижнего края (в пикселях)
        // radius — радиус колеса (в пикселях)
        const WHEEL_CONFIG = {
            mazda: {
                rearX: 16,      // заднее колесо
                frontX: 78,     // переднее колесо
                y: 10,          // отступ от низа
                radius: 9,
            },
            toyota: {
                rearX: 24,
                frontX: 82,
                y: 10,
                radius: 10,
            },
            honda: {
                rearX: 17,
                frontX: 80,
                y: 10,
                radius: 9,
            },
        };
        
        // Выбор машины
        let selectedCar = 'mazda';
        let gameStarted = false;
        
        // Кнопки выбора машины
        document.querySelectorAll('.carOption').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.carOption').forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
                selectedCar = option.dataset.car;
            });
        });
        
        // Кнопка старта (двойной клик по выбранной машине)
        document.querySelectorAll('.carOption').forEach(option => {
            option.addEventListener('dblclick', () => {
                startGame();
            });
        });
        
        // Или через пробел на экране выбора
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !gameStarted) {
                e.preventDefault();
                startGame();
            }
        });
        
        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            
            // Загружаем картинку выбранной машины
            const paths = {
                mazda: 'assets/car_mazda.png',
                toyota: 'assets/car_toyota.png',
                honda: 'assets/car_honda.png'
            };
            car.image.src = paths[selectedCar];
            
            // Скрываем меню, показываем игру
            document.getElementById('carSelect').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            
            // Фокус на canvas для управления
            document.getElementById('game').focus();
        }

        // ============ ФИЗИКА (плавная) ============
        const GRAVITY = 0.5;           // Меньше гравитация — плавнее падение
        const JUMP_FORCE = -12;        // Меньше сила — плавнее подъём
        const HANG_TIME = 6;           // Задержка в воздухе (кадров)
        const OBSTACLE_SPEED = 4;

        // ============ ОБЛАКА (параллакс) ============
        let clouds = [];
        function initClouds() {
            clouds = [];
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * W,
                    y: 30 + Math.random() * 80,
                    size: 20 + Math.random() * 40,
                    speed: 0.5 + Math.random() * 0.5
                });
            }
        }
        initClouds();

               // ============ ЗДАНИЯ (параллакс, дальний план) ============
        let farBuildings = [];
        function initFarBuildings() {
            farBuildings = [];
            let x = 0;
            while (x < W + 200) {
                const w = 40 + Math.random() * 50;
                const h = 80 + Math.random() * 100;
                farBuildings.push({
                    x: x,
                    width: w,
                    height: h,
                    speed: 0.5
                });
                x += w + 10;
            }
        }
        initFarBuildings();

        // ============ ЗДАНИЯ (параллакс, ближний план) ============
        let nearBuildings = [];
        function initNearBuildings() {
            nearBuildings = [];
            let x = 0;
            while (x < W + 200) {
                const w = 60 + Math.random() * 70;
                const h = 120 + Math.random() * 120;
                // Генерируем окна
                const windows = [];
                const cols = Math.floor(w / 20);
                const rows = Math.floor(h / 25);
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        windows.push({
                            x: c * 20 + 8,
                            y: r * 25 + 10,
                            lit: Math.random() > 0.4  // 60% окон светятся
                        });
                    }
                }
                nearBuildings.push({
                    x: x,
                    width: w,
                    height: h,
                    speed: 1.5,
                    windows: windows,
                    color: Math.random() > 0.5 ? '#3A3A4A' : '#2D2D3A'
                });
                x += w + 15;
            }
        }
        initNearBuildings();

        // ============ ПРЕПЯТСТВИЯ ============
        let obstacles = [];
        let spawnTimer = 0;

        const OBSTACLE_TYPES = [
            { type: 'cone', width: 30, height: 45 },
            { type: 'tires_1', width: 70, height: 20 },
            { type: 'tires_2', width: 70, height: 40 },
            { type: 'tires_3', width: 70, height: 60 },
        ];

        function spawnObstacle() {
            const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
            obstacles.push({
                x: W,
                y: GROUND_Y - type.height,
                width: type.width,
                height: type.height,
                type: type.type
            });
        }

        // ============ МОНЕТКИ ============
        let coins = [];
        let coinSpawnTimer = 0;

        function spawnCoin() {
            coins.push({
                x: W,
                y: GROUND_Y - 120 - Math.random() * 60,
                size: 20,
                collected: false,
                rotation: 0
            });
        }

        // ============ СЧЁТ ============
        let score = 0;
        let gameOver = false;
        let flashTimer = 0;
        let roadOffset = 0;

        // ============ ПРЫЖОК ============
        function jump() {
            if (!car.jumping && !gameOver) {
                car.vy = JUMP_FORCE;
                car.jumping = true;
                car.hangFrames = HANG_TIME;  // Задержка в воздухе
            }
            if (gameOver) restart();
        }
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });
        canvas.addEventListener('click', jump);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        // ============ ОБНОВЛЕНИЕ ============
        function update() {
            if (gameOver) {
                if (flashTimer > 0) flashTimer--;
                return;
            }

            // Машина — плавная физика
            if (car.hangFrames > 0) {
                // Задержка в воздухе (не применяем гравитацию)
                car.hangFrames--;
                car.y += car.vy * 0.3;  // Движемся медленно
            } else {
                // Обычная гравитация
                car.vy += GRAVITY;
                car.y += car.vy;
            }
            
            // Наклон машины при прыжке
            if (car.jumping) {
                car.rotation = Math.min(car.rotation + 0.05, 0.3);  // Наклоняем вперёд
            } else {
                car.rotation = Math.max(car.rotation - 0.1, 0);    // Выравниваем
            }
            
            // Колёса крутятся быстрее в воздухе
            car.wheelRotation += car.jumping ? 0.6 : 0.3;

            if (car.y >= GROUND_Y - car.height) {
                car.y = GROUND_Y - car.height;
                car.vy = 0;
                car.jumping = false;
                car.hangFrames = 0;
                car.rotation = 0;
            }
            // Облака
            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x + c.size * 2 < 0) {
                    c.x = W + c.size;
                    c.y = 30 + Math.random() * 80;
                }
            });

            // Дальние здания (медленнее)
            farBuildings.forEach(b => {
                b.x -= b.speed;
                if (b.x + b.width < 0) {
                    b.x = W;
                    b.height = 80 + Math.random() * 100;
                    b.width = 40 + Math.random() * 50;
                }
            });

            // Ближние здания (быстрее)
            nearBuildings.forEach(b => {
                b.x -= b.speed;
                if (b.x + b.width < 0) {
                    b.x = W;
                    b.height = 120 + Math.random() * 120;
                    b.width = 60 + Math.random() * 70;
                    // Перегенерируем окна
                    b.windows = [];
                    const cols = Math.floor(b.width / 20);
                    const rows = Math.floor(b.height / 25);
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            b.windows.push({
                                x: c * 20 + 8,
                                y: r * 25 + 10,
                                lit: Math.random() > 0.4
                            });
                        }
                    }
                }
            });

            // Анимация дороги
            roadOffset += OBSTACLE_SPEED;
            if (roadOffset > 80) roadOffset = 0;

            // Препятствия
            obstacles.forEach(obs => {
                if (obs.type === 'cone') {
                    // Конус — оранжевый с полосами
                    ctx.fillStyle = '#FF6B00';
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.width/2, obs.y);
                    ctx.lineTo(obs.x, obs.y + obs.height);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();
                    
                    // Тёмный контур
                    ctx.strokeStyle = '#8B3A00';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // Белая полоса
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(obs.x + 8, obs.y + 20, obs.width - 16, 8);
                    
                    // Тень под конусом
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.beginPath();
                    ctx.ellipse(obs.x + obs.width/2, obs.y + obs.height + 2,
                                obs.width/2, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (obs.type.startsWith('tires')) {
                    // Стопка шин (пиксельный стиль, вид сверху-сбоку)
                    const count = parseInt(obs.type.split('_')[1]);
                    const tireH = 22;      // высота одной шины (боковина)
                    const tireW = obs.width;
                    const topH = 20;       // высота верхней части (эллипс)
                    
                    for (let i = 0; i < count; i++) {
                        const y = obs.y + obs.height - (i + 1) * tireH;
                        const isTop = (i === count - 1);
                        
                        // ===== БОКОВИНА ШИНЫ (прямоугольник с пиксельным контуром) =====
                        
                        // Тень слева (тёмная сторона)
                        ctx.fillStyle = '#0A0A0A';
                        ctx.fillRect(obs.x, y + 5, 3, tireH - 5);
                        
                        // Основная боковина
                        ctx.fillStyle = '#1A1A1A';
                        ctx.fillRect(obs.x + 3, y + 5, tireW - 6, tireH - 5);
                        
                        // Правый край (светлый)
                        ctx.fillStyle = '#2A2A2A';
                        ctx.fillRect(obs.x + tireW - 5, y + 5, 2, tireH - 5);
                        
                        // ===== ПИКСЕЛЬНЫЙ ПРОТЕКТОР НА БОКОВИНЕ =====
                        // Зигзагообразные полосы
                        ctx.fillStyle = '#0F0F0F';
                        for (let px = 6; px < tireW - 6; px += 8) {
                            // Наклонная полоса 1
                            ctx.fillRect(obs.x + px, y + 7, 3, 3);
                            ctx.fillRect(obs.x + px + 1, y + 10, 3, 3);
                            ctx.fillRect(obs.x + px + 2, y + 13, 3, 3);
                            
                            // Наклонная полоса 2 (обратная)
                            ctx.fillRect(obs.x + px + 3, y + 7, 3, 3);
                            ctx.fillRect(obs.x + px + 2, y + 10, 3, 3);
                            ctx.fillRect(obs.x + px + 1, y + 13, 3, 3);
                        }
                        
                        // ===== ВЕРХНЯЯ ЧАСТЬ ШИНЫ (только для верхней шины в стопке) =====
                        if (isTop) {
                            // Верхний эллипс (вид сверху) — тёмный
                            ctx.fillStyle = '#1A1A1A';
                            ctx.beginPath();
                            ctx.ellipse(obs.x + tireW/2, y + 5,
                                        tireW/2, topH, 0, 0, Math.PI * 2);
                            ctx.fill();
                            
                            // Пиксельный контур верхнего эллипса
                            ctx.strokeStyle = '#000';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.ellipse(obs.x + tireW/2, y + 5,
                                        tireW/2, topH, 0, 0, Math.PI * 2);
                            ctx.stroke();
                            
                            // ПРОТЕКТОР на верхней части (вид сверху)
                            // Поперечные канавки
                            ctx.fillStyle = '#0A0A0A';
                            for (let px = -tireW/2 + 8; px < tireW/2 - 6; px += 8) {
                                ctx.fillRect(obs.x + tireW/2 + px, y - 6, 3, 18);
                            }
                            
                            // ПРОДОЛЬНЫЕ канавки (по бокам от центра)
                            ctx.fillStyle = '#0A0A0A';
                            ctx.beginPath();
                            ctx.ellipse(obs.x + tireW/2, y + 5,
                                        tireW/2 - 8, topH - 3, 0, 0, Math.PI * 2);
                            ctx.stroke();
                            
                            // ===== ДИСК (по центру верхней шины) =====
                            const discX = obs.x + tireW/2;
                            const discY = y + 5;
                            
                            // Внешний обод (серебристый)
                            ctx.fillStyle = '#8A8A8A';
                            ctx.beginPath();
                            ctx.ellipse(discX, discY,
                                        tireW/2 - 8, topH - 6, 0, 0, Math.PI * 2);
                            ctx.fill();
                            
                            // Внутренняя часть диска (темнее)
                            ctx.fillStyle = '#5A5A5A';
                            ctx.beginPath();
                            ctx.ellipse(discX, discY,
                                        tireW/2 - 12, topH - 9, 0, 0, Math.PI * 2);
                            ctx.fill();
                            
                            // Контур диска
                            ctx.strokeStyle = '#2A2A2A';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.ellipse(discX, discY,
                                        tireW/2 - 8, topH - 6, 0, 0, Math.PI * 2);
                            ctx.stroke();
                            
                            // БОЛТЫ (4 штуки по кресту) — крупные
                            ctx.fillStyle = '#2A2A2A';
                            const boltDist = 6;
                            ctx.fillRect(discX - boltDist - 2, discY - 2, 4, 4);
                            ctx.fillRect(discX + boltDist - 2, discY - 2, 4, 4);
                            ctx.fillRect(discX - 2, discY - boltDist - 2, 4, 4);
                            ctx.fillRect(discX - 2, discY + boltDist - 2, 4, 4);
                            
                            // Центральный болт (крупнее)
                            ctx.fillStyle = '#3A3A3A';
                            ctx.fillRect(discX - 3, discY - 3, 6, 6);
                            
                            // Блик на диске
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                            ctx.fillRect(discX - 8, discY - 6, 4, 3);
                            ctx.fillRect(discX - 6, discY - 8, 3, 2);                        }
                    }
                }
             });

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= OBSTACLE_SPEED;

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreEl.textContent = 'Счёт: ' + score;
                }

                // Коллизия
                if (
                    car.x + 20 < obs.x + obs.width &&
                    car.x + car.width - 20 > obs.x &&
                    car.y + car.height > obs.y
                ) {
                    gameOver = true;
                    flashTimer = 20;
                }
            }

            // Препятствия
            spawnTimer++;
            if (spawnTimer > 90) {
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.x -= OBSTACLE_SPEED;

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreEl.textContent = 'Счёт: ' + score;
                }

                if (
                    car.x + 20 < obs.x + obs.width &&
                    car.x + car.width - 20 > obs.x &&
                    car.y + car.height > obs.y
                ) {
                    gameOver = true;
                    flashTimer = 20;
                }
            }

            // Монетки
            coinSpawnTimer++;
            if (coinSpawnTimer > 200) {
                spawnCoin();
                coinSpawnTimer = 0;
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.x -= OBSTACLE_SPEED;
                coin.rotation += 0.1;

                if (coin.x + coin.size < 0) {
                    coins.splice(i, 1);
                    continue;
                }

                // Сбор монетки
                const dx = (car.x + car.width/2) - (coin.x + coin.size/2);
                const dy = (car.y + car.height/2) - (coin.y + coin.size/2);
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < 60) {
                    coins.splice(i, 1);
                    score += 50;
                    scoreEl.textContent = 'Счёт: ' + score;
                }
            }
        }

                // ============ ИНТЕРПОЛЯЦИЯ ЦВЕТОВ ============
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => {
                const hex = Math.round(x).toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('');
        }

        function mixColor(color1, color2, t) {
            // t = 0 -> color1, t = 1 -> color2
            if (color1.startsWith('rgba') || color2.startsWith('rgba')) {
                // Для rgba просто возвращаем color2 если t > 0.5, иначе color1
                return t > 0.5 ? color2 : color1;
            }
            const c1 = hexToRgb(color1);
            const c2 = hexToRgb(color2);
            return rgbToHex(
                c1.r + (c2.r - c1.r) * t,
                c1.g + (c2.g - c1.g) * t,
                c1.b + (c2.b - c1.b) * t
            );
        }

        // ============ СЦЕНАРИИ (день/закат/ночь/рассвет) ============
        function getScenario(score) {
            const cycle = Math.floor(score / 500) % 4;
            if (cycle === 0) return 'day';
            if (cycle === 1) return 'sunset';
            if (cycle === 2) return 'night';
            return 'dawn';
        }

        function getScenarioTransition(score) {
            // Возвращает: { current, next, t }
            // t: 0 = полностью current, 1 = полностью next
            const TRANSITION_RANGE = 50; // за сколько очков до перехода начинаем
            const cyclePos = score % 500;
            
            const scenarios = ['day', 'sunset', 'night', 'dawn'];
            const currentCycle = Math.floor(score / 500) % 4;
            const nextCycle = (currentCycle + 1) % 4;
            
            // Если мы в конце текущего цикла — начинаем переход
            if (cyclePos >= (500 - TRANSITION_RANGE)) {
                const t = (cyclePos - (500 - TRANSITION_RANGE)) / TRANSITION_RANGE;
                return {
                    current: scenarios[currentCycle],
                    next: scenarios[nextCycle],
                    t: t
                };
            }
            
            // Иначе — полный текущий
            return {
                current: scenarios[currentCycle],
                next: scenarios[currentCycle],
                t: 0
            };
        }

        function getMixedScenario(score) {
            const trans = getScenarioTransition(score);
            const a = SCENARIOS[trans.current];
            const b = SCENARIOS[trans.next];
            const t = trans.t;
            
            return {
                skyTop: mixColor(a.skyTop, b.skyTop, t),
                skyBottom: mixColor(a.skyBottom, b.skyBottom, t),
                sun: a.sun,  // солнце/луну не смешиваем (это объекты, а не цвета)
                sunGlow: mixColor(a.sunGlow, b.sunGlow, t),
                cloud: mixColor(a.cloud, b.cloud, t),
                buildingDark: mixColor(a.buildingDark, b.buildingDark, t),
                buildingLight: mixColor(a.buildingLight, b.buildingLight, t),
                windowLit: mixColor(a.windowLit, b.windowLit, t),
                windowDim: mixColor(a.windowDim, b.windowDim, t),
                road: mixColor(a.road, b.road, t),
                roadTexture: mixColor(a.roadTexture, b.roadTexture, t),
                isNight: t > 0.5 ? b.isNight : a.isNight,
                isSunset: t > 0.5 ? b.isSunset : a.isSunset,
            };
        }

        const SCENARIOS = {
            day: {
                skyTop: '#4A90D9',
                skyBottom: '#87CEEB',
                sun: 'rgba(255, 220, 100, 0.9)',
                sunGlow: 'rgba(255, 220, 100, 0.3)',
                cloud: 'rgba(255, 255, 255, 0.9)',
                buildingDark: 'rgba(45, 45, 60, 0.6)',
                buildingLight: '#3A3A4A',
                windowLit: '#FFD54F',
                windowDim: '#1A1A24',
                road: '#3A3A3A',
                roadTexture: '#4A4A4A',
                isNight: false,
                isSunset: false,
            },
            sunset: {
                skyTop: '#FF6B3D',
                skyBottom: '#FFB366',
                sun: 'rgba(255, 100, 50, 0.9)',
                sunGlow: 'rgba(255, 100, 50, 0.3)',
                cloud: 'rgba(255, 200, 180, 0.9)',
                buildingDark: 'rgba(60, 30, 40, 0.7)',
                buildingLight: '#4A2030',
                windowLit: '#FFAA44',
                windowDim: '#2A1020',
                road: '#3A2A2A',
                roadTexture: '#4A3A3A',
                isNight: false,
                isSunset: true,
            },
            night: {
                skyTop: '#0A0A2A',
                skyBottom: '#1A1A4A',
                sun: 'rgba(200, 200, 255, 0.9)',
                sunGlow: 'rgba(200, 200, 255, 0.3)',
                cloud: 'rgba(100, 100, 150, 0.6)',
                buildingDark: 'rgba(20, 20, 40, 0.9)',
                buildingLight: '#1A1A2A',
                windowLit: '#FFEB3B',
                windowDim: '#0A0A1A',
                road: '#1A1A1A',
                roadTexture: '#2A2A2A',
                isNight: true,
                isSunset: false,
            },
            dawn: {
                skyTop: '#6A4A8A',
                skyBottom: '#FFB3D9',
                sun: 'rgba(255, 200, 220, 0.9)',
                sunGlow: 'rgba(255, 200, 220, 0.3)',
                cloud: 'rgba(255, 220, 240, 0.9)',
                buildingDark: 'rgba(50, 30, 60, 0.7)',
                buildingLight: '#3A2040',
                windowLit: '#FFE4B5',
                windowDim: '#1A0A20',
                road: '#2A2030',
                roadTexture: '#3A3040',
                isNight: false,
                isSunset: false,
            },
        };

        // ============ РИСОВАНИЕ ============
        function draw() {
            const sc = getMixedScenario(score);

            // Небо (градиент по сценарию)
            const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
            skyGrad.addColorStop(0, sc.skyTop);
            skyGrad.addColorStop(1, sc.skyBottom);
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, GROUND_Y);

            // Солнце / Луна
            ctx.fillStyle = sc.sun;
            ctx.beginPath();
            ctx.arc(W - 100, 80, 50, 0, Math.PI * 2);
            ctx.fill();

            // Свечение
            ctx.fillStyle = sc.sunGlow;
            ctx.beginPath();
            ctx.arc(W - 100, 80, 70, 0, Math.PI * 2);
            ctx.fill();

            // Звёзды (только ночью)
            if (sc.isNight) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 30; i++) {
                    const sx = (i * 137) % W;
                    const sy = (i * 73) % (GROUND_Y - 100);
                    const size = (i % 3) + 1;
                    ctx.fillRect(sx, sy, size, size);
                }
            }

            // Облака
            clouds.forEach(c => {
                ctx.fillStyle = sc.cloud;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.8, c.y + 5, c.size * 0.9, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 1.5, c.y, c.size * 0.8, 0, Math.PI * 2);
                ctx.fill();
            });

            // Дальние здания
            farBuildings.forEach(b => {
                ctx.fillStyle = sc.buildingDark;
                ctx.fillRect(b.x, GROUND_Y - b.height, b.width, b.height);
                
                if (b.height > 120) {
                    ctx.fillStyle = sc.buildingDark;
                    ctx.fillRect(b.x + b.width/2 - 1, GROUND_Y - b.height - 20, 2, 20);
                    const blink = Math.sin(Date.now() / 500) > 0;
                    if (blink) {
                        ctx.fillStyle = 'rgba(255, 50, 50, 0.8)';
                        ctx.fillRect(b.x + b.width/2 - 2, GROUND_Y - b.height - 22, 4, 4);
                    }
                }
            });

            // Ближние здания
            nearBuildings.forEach(b => {
                const bY = GROUND_Y - b.height;
                
                // Корпус здания (цвет по сценарию)
                ctx.fillStyle = sc.isNight ? sc.buildingLight : b.color;
                ctx.fillRect(b.x, bY, b.width, b.height);
                
                // Контур
                ctx.strokeStyle = sc.isNight ? '#0A0A1A' : '#1A1A24';
                ctx.lineWidth = 2;
                ctx.strokeRect(b.x, bY, b.width, b.height);
                
                // Окна
                b.windows.forEach(w => {
                    if (w.x + 10 > b.width || w.y + 12 > b.height) return;
                    
                    if (w.lit) {
                        ctx.fillStyle = sc.windowLit;
                        ctx.fillRect(b.x + w.x, bY + w.y, 10, 12);
                        // Блик (ярче ночью)
                        ctx.fillStyle = sc.isNight ? 'rgba(255, 255, 200, 0.8)' : 'rgba(255, 245, 157, 1)';
                        ctx.fillRect(b.x + w.x, bY + w.y, 10, 3);
                    } else {
                        ctx.fillStyle = sc.windowDim;
                        ctx.fillRect(b.x + w.x, bY + w.y, 10, 12);
                    }
                });
            });

            // Тротуар (верхняя часть)
            ctx.fillStyle = '#9E9E9E';
            ctx.fillRect(0, GROUND_Y, W, 8);
            
            // Бордюр
            ctx.fillStyle = '#616161';
            ctx.fillRect(0, GROUND_Y + 8, W, 4);

            // Асфальт (цвет по сценарию)
            ctx.fillStyle = sc.road;
            ctx.fillRect(0, GROUND_Y + 12, W, H - GROUND_Y - 12);

            // Текстура асфальта (двигается)
            ctx.fillStyle = sc.roadTexture;
            for (let x = -roadOffset; x < W; x += 20) {
                ctx.fillRect(x, GROUND_Y + 20, 8, 3);
                ctx.fillRect(x + 10, GROUND_Y + 40, 6, 2);
                ctx.fillRect(x + 5, GROUND_Y + 60, 10, 3);
            }

            // Разметка дороги (двигается)
            ctx.fillStyle = '#FFD700';
            for (let x = -roadOffset; x < W; x += 80) {
                ctx.fillRect(x, GROUND_Y + 45, 40, 6);
            }

            // Препятствия
            obstacles.forEach(obs => {
                if (obs.type === 'cone') {
                    // Конус — оранжевый с полосами
                    ctx.fillStyle = '#FF6B00';
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.width/2, obs.y);
                    ctx.lineTo(obs.x, obs.y + obs.height);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();
                    
                    // Тёмный контур
                    ctx.strokeStyle = '#8B3A00';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // Белая полоса
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(obs.x + 8, obs.y + 20, obs.width - 16, 8);
                    
                    // Тень под конусом
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.beginPath();
                    ctx.ellipse(obs.x + obs.width/2, obs.y + obs.height + 2,
                                obs.width/2, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (obs.type.startsWith('tires')) {
                    // Стопка шин (лежат, вид сбоку, виден протектор)
                    const count = parseInt(obs.type.split('_')[1]);
                    const tireHeight = 20; // Высота одной шины (как блин)
                    const tireWidth = obs.width;
                    
                    for (let i = 0; i < count; i++) {
                        // Нижняя шина рисуется первой, верхняя — последней
                        const y = obs.y + obs.height - ((i + 1) * tireHeight);
                        
                        // 1. Тень под шиной
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                        ctx.beginPath();
                        ctx.ellipse(obs.x + tireWidth/2 + 2, y + tireHeight, tireWidth/2, 4, 0, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 2. Основной корпус шины (тёмно-серый прямоугольник со скруглениями)
                        ctx.fillStyle = '#222';
                        ctx.beginPath();
                        ctx.roundRect(obs.x, y, tireWidth, tireHeight, 5);
                        ctx.fill();
                        
                        // 3. Блик сверху (резина блестит)
                        ctx.fillStyle = '#444';
                        ctx.fillRect(obs.x + 4, y + 2, tireWidth - 8, 4);
                        
                        // 4. Протектор (зигзагообразные линии)
                        ctx.strokeStyle = '#0a0a0a';
                        ctx.lineWidth = 2;
                        for (let px = 8; px < tireWidth - 8; px += 12) {
                            ctx.beginPath();
                            // Зигзаг вправо
                            ctx.moveTo(obs.x + px, y + 8);
                            ctx.lineTo(obs.x + px + 4, y + 12);
                            ctx.lineTo(obs.x + px, y + 16);
                            // Зигзаг влево
                            ctx.moveTo(obs.x + px + 6, y + 8);
                            ctx.lineTo(obs.x + px + 2, y + 12);
                            ctx.lineTo(obs.x + px + 6, y + 16);
                            ctx.stroke();
                        }
                        
                        // 5. Боковина (светлая полоса снизу)
                        ctx.fillStyle = '#333';
                        ctx.fillRect(obs.x + 4, y + tireHeight - 4, tireWidth - 8, 2);
                    }
                }
            });

            // Монетки
            coins.forEach(coin => {
                const scaleX = Math.abs(Math.cos(coin.rotation));
                ctx.save();
                ctx.translate(coin.x + coin.size/2, coin.y + coin.size/2);
                ctx.scale(scaleX, 1);
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(0, 0, coin.size/2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#FFA000';
                ctx.beginPath();
                ctx.arc(0, 0, coin.size/2 - 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', 0, 0);
                ctx.restore();
            });


            // Машина
            // Машина
            if (car.image.complete && car.image.naturalHeight > 0) {
                // Наклон машины при прыжке
                ctx.save();
                ctx.translate(car.x + car.width / 2, car.y + car.height / 2);
                ctx.rotate(car.rotation);
                ctx.translate(-(car.x + car.width / 2), -(car.y + car.height / 2));
                
                ctx.drawImage(car.image, car.x, car.y, car.width, car.height);
                
                // Рисуем колёса с индивидуальными настройками
                const cfg = WHEEL_CONFIG[selectedCar] || WHEEL_CONFIG.mazda;
                const wheelY = car.y + car.height - cfg.y;
                
                // Заднее колесо
                drawWheel(
                    car.x + (car.width * cfg.rearX / 100),
                    wheelY,
                    cfg.radius,
                    car.wheelRotation
                );
                
                // Переднее колесо
                drawWheel(
                    car.x + (car.width * cfg.frontX / 100),
                    wheelY,
                    cfg.radius,
                    car.wheelRotation
                );
                
                ctx.restore();
            } else {
                ctx.fillStyle = '#E60012';
                ctx.fillRect(car.x, car.y, car.width, car.height);
                ctx.fillStyle = '#000';
                ctx.font = '12px Arial';
                ctx.fillText('Mazda', car.x + 15, car.y + 30);
            }

            // Вспышка при столкновении
            if (flashTimer > 0) {
                ctx.fillStyle = `rgba(255, 0, 0, ${flashTimer / 40})`;
                ctx.fillRect(0, 0, W, H);
            }

             // Индикатор сценария (в правом верхнем углу)
            const scName = getScenario(score);
            const scLabel = { day: '☀️ День', sunset: '🌅 Закат', night: '🌙 Ночь', dawn: '🌄 Рассвет' }[scName];
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(W - 120, 10, 110, 30);
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(scLabel, W - 110, 30);


            // Game Over
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#FF6B00';
                ctx.font = 'bold 50px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Игра окончена', W/2, H/2 - 20);
                ctx.fillStyle = 'white';
                ctx.font = '24px Arial';
                ctx.fillText('Счёт: ' + score, W/2, H/2 + 30);
                ctx.font = '18px Arial';
                ctx.fillText('Пробел или тап — заново', W/2, H/2 + 70);
                ctx.textAlign = 'left';
            }
        }

        function restart() {
            score = 0;
            scoreEl.textContent = 'Счёт: 0';
            obstacles = [];
            coins = [];
            gameOver = false;
            spawnTimer = 0;
            coinSpawnTimer = 0;
            flashTimer = 0;
            roadOffset = 0;
            car.y = GROUND_Y - car.height;
            car.vy = 0;
            car.jumping = false;
            car.hangFrames = 0;
            car.rotation = 0;
            car.wheelRotation = 0;
        }

        function drawWheel(x, y, radius, rotation) {
            // Шина
            ctx.fillStyle = '#1A1A1A';
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Диск
            ctx.fillStyle = '#9E9E9E';
            ctx.beginPath();
            ctx.arc(x, y, radius - 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Спицы (вращаются)
            ctx.strokeStyle = '#616161';
            ctx.lineWidth = 2;
            for (let i = 0; i < 4; i++) {
                const angle = rotation + (i * Math.PI / 2);
                const x1 = x + Math.cos(angle) * 2;
                const y1 = y + Math.sin(angle) * 2;
                const x2 = x + Math.cos(angle) * (radius - 4);
                const y2 = y + Math.sin(angle) * (radius - 4);
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
            
            // Центральный болт
            ctx.fillStyle = '#424242';
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        document.getElementById('changeCarBtn').addEventListener('click', () => {
            gameStarted = false;
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('carSelect').style.display = 'block';
            // Сбрасываем игру
            gameOver = false;
            score = 0;
            scoreEl.textContent = 'Счёт: 0';
            obstacles = [];
            coins = [];
            car.y = GROUND_Y - car.height;
            car.vy = 0;
            car.jumping = false;
        });

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

         let loopStarted = false;

        car.image.onload = () => {
            console.log('Машина загружена:', car.image.width, 'x', car.image.height);
            if (!loopStarted) {
                loopStarted = true;
                loop();
            }
        };

        car.image.onerror = () => {
            console.error('Не удалось загрузить car.png');
            loop();
        };
    </script>
